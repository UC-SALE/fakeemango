<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popup Site</title>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family:sans-serif;
}

/* Background */
.background{
    position:fixed;
    inset:0;
    background:url("zurag.png") no-repeat center center;
    background-size:cover;
}

/* Dark overlay */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    justify-content:center;
    align-items:flex-end;
    opacity:0;
    pointer-events:none;
    transition:0.3s;
}

.overlay.active{
    opacity:1;
    pointer-events:all;
}

/* Popup */
.popup{
    width:90%;
    max-width:400px;
    margin-bottom:40px;
    transition:transform 0.3s ease;
    touch-action:none;
}

/* Open button */
.openBtn{
    position:absolute;
    top:20px;
    left:20px;
    padding:10px 20px;
    border:none;
    background:black;
    color:white;
    border-radius:8px;
}
</style>
</head>
<body>

<div class="background"></div>

<div class="overlay" id="overlay">
    <img src="pop.png" class="popup" id="popup">
</div>

<button class="openBtn" onclick="openPopup()">OPEN</button>

<script>
const overlay = document.getElementById("overlay");
const popup = document.getElementById("popup");

let startY = 0;
let currentY = 0;
let dragging = false;

function openPopup(){
    overlay.classList.add("active");
    popup.style.transform = "translateY(0)";
}

popup.addEventListener("touchstart",(e)=>{
    startY = e.touches[0].clientY;
    dragging = true;
});

popup.addEventListener("touchmove",(e)=>{
    if(!dragging) return;
    currentY = e.touches[0].clientY - startY;

    if(currentY > 0){ // зөвхөн доош
        popup.style.transform = `translateY(${currentY}px)`;
    }
});

popup.addEventListener("touchend",()=>{
    dragging = false;

    if(currentY > 120){
        popup.style.transform = "translateY(800px)";
        setTimeout(()=>{
            overlay.classList.remove("active");
            popup.style.transform = "translateY(0)";
        },300);
    } else {
        popup.style.transform = "translateY(0)";
    }

    currentY = 0;
});
</script>

</body>
</html>
