<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen Popup Flip</title>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
}

/* Background */
.background{
    position:fixed;
    inset:0;
    background:url("zurag.png") no-repeat center center;
    background-size:cover;
}

/* Invisible middle button */
.middleBtn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:200px;
    height:200px;
    background:transparent;
}

/* Dark overlay */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    opacity:0;
    pointer-events:none;
    transition:0.3s;
}

.overlay.active{
    opacity:1;
    pointer-events:all;
}

/* Popup */
.popup{
    position:absolute;
    inset:0;
    transition:transform 0.3s ease;
    touch-action:none;
}

/* pop.png background */
.popBg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

/* FULLSCREEN FLIP */
.flip-card{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    perspective:1000px;
}

.flip-inner{
    width:100%;
    height:100%;
    position:relative;
    transition:transform 0.6s;
    transform-style:preserve-3d;
}

.flip-inner.flipped{
    transform:rotateY(180deg);
}

.flip-front,
.flip-back{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    backface-visibility:hidden;
}

.flip-front img,
.flip-back img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.flip-back{
    transform:rotateY(180deg);
}
</style>
</head>
<body>

<div class="background"></div>
<div class="middleBtn" onclick="openPopup()"></div>

<div class="overlay" id="overlay">
    <div class="popup" id="popup">
        
        <!-- pop background -->
        <img src="pop.png" class="popBg">

        <!-- FULLSCREEN flip -->
        <div class="flip-card">
            <div class="flip-inner" id="flipCard">
                <div class="flip-front">
                    <img src="1face.png">
                </div>
                <div class="flip-back">
                    <img src="2face.png">
                </div>
            </div>
        </div>

    </div>
</div>

<script>
const overlay = document.getElementById("overlay");
const popup = document.getElementById("popup");
const flipCard = document.getElementById("flipCard");

let startY = 0;
let currentY = 0;
let dragging = false;

/* Open popup */
function openPopup(){
    overlay.classList.add("active");
    popup.style.transform = "translateY(0)";
}

/* Flip */
flipCard.addEventListener("click",(e)=>{
    e.stopPropagation();
    flipCard.classList.toggle("flipped");
});

/* Drag to close */
popup.addEventListener("touchstart",(e)=>{
    startY = e.touches[0].clientY;
    dragging = true;
});

popup.addEventListener("touchmove",(e)=>{
    if(!dragging) return;
    currentY = e.touches[0].clientY - startY;

    if(currentY > 0){
        popup.style.transform = `translateY(${currentY}px)`;
    }
});

popup.addEventListener("touchend",()=>{
    dragging = false;

    if(currentY > 150){
        popup.style.transform = "translateY(100%)";
        setTimeout(()=>{
            overlay.classList.remove("active");
            popup.style.transform = "translateY(0)";
        },300);
    } else {
        popup.style.transform = "translateY(0)";
    }

    currentY = 0;
});
</script>

</body>
</html>
