<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: url("zurag.png") no-repeat center center;
  background-size: cover;
}

/* Dark background when popup active */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Popup image */
#popup {
  width: 200px;
  touch-action: none;
  transition: transform 0.3s ease;
}
</style>
</head>
<body>

<div id="overlay">
  <img src="pop.png" id="popup">
</div>

<script>
const popup = document.getElementById("popup");
const overlay = document.getElementById("overlay");

let startY = 0;
let moveY = 0;
let dragging = false;

popup.addEventListener("touchstart", e => {
  dragging = true;
  startY = e.touches[0].clientY;
  popup.style.transition = "none";
});

popup.addEventListener("touchmove", e => {
  if (!dragging) return;
  moveY = e.touches[0].clientY - startY;
  if (moveY > 0) {
    popup.style.transform = `translateY(${moveY}px)`;
  }
});

popup.addEventListener("touchend", () => {
  dragging = false;

  if (moveY > 150) { 
    overlay.style.display = "none";  // доош шидвэл алга болно
  } else {
    popup.style.transition = "transform 0.3s ease";
    popup.style.transform = "translateY(0)";
  }

  moveY = 0;
});

/* Background дарвал popup дахин гарч ирнэ */
document.body.addEventListener("click", () => {
  if (overlay.style.display === "none") {
    overlay.style.display = "flex";
    popup.style.transform = "translateY(0)";
  }
});
</script>

</body>
</html>
