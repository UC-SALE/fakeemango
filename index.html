<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Popup Split Control</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

.background {
  position: fixed;
  inset: 0;
  background: url("zurag.png") no-repeat center center;
  background-size: cover;
}

.middleBtn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  background: transparent;
  cursor: pointer;
  z-index: 10;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
}

.overlay.active {
  opacity: 1;
  pointer-events: all;
}

.popup {
  position: absolute;
  width: 300px;
  height: 200px;
  background: white;
  border-radius: 8px;
  overflow: hidden;
  cursor: grab;
  will-change: transform;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  /* For smooth dragging */
  transition: box-shadow 0.2s;
}

.popup:active {
  cursor: grabbing;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.popBg {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Fullscreen Flip (not used here, but kept from original) */
.flip-card {
  position: absolute;
  inset: 0;
  perspective: 1000px;
}

.flip-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.flip-inner.flipped {
  transform: rotateY(180deg);
}

.flip-front,
.flip-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
}

.flip-back {
  transform: rotateY(180deg);
}
</style>
</head>
<body>

<div class="background"></div>
<div class="middleBtn" onclick="openPopup()"></div>

<div class="overlay" id="overlay">
  <div class="popup" id="popup">
    <img src="pop.png" class="popBg" />
  </div>
</div>

<script>
const overlay = document.getElementById('overlay');
const popup = document.getElementById('popup');

function openPopup() {
  overlay.classList.add('active');
}

// Close popup when clicking outside (optional)
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) {
    overlay.classList.remove('active');
  }
});

// Drag functionality
let isDragging = false;
let startX = 0;
let startY = 0;
let currentX = 0;
let currentY = 0;
let offsetX = 0;
let offsetY = 0;

popup.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX;
  startY = e.clientY;
  popup.style.transition = 'none'; // Disable transition during drag
});

document.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    offsetX = currentX;
    offsetY = currentY;
    popup.style.transition = 'box-shadow 0.2s';
  }
});

document.addEventListener('mousemove', (e) => {
  if (isDragging) {
    currentX = offsetX + e.clientX - startX;
    currentY = offsetY + e.clientY - startY;
    // Use translate3d for hardware acceleration
    popup.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
  }
});
</script>

</body>
</html>
